[package]
name = "nurset"
version = "0.1.0"
description = "NurSet - clinical duty companion for nursing students (desktop app)"
edition = "2021"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "nurset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
